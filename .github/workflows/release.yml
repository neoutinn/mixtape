# Builds the Windows / Mac / Linux apps and publishes them as a GitHub Release.
# Trigger it by pushing a tag:  git tag v1.0.0 && git push --tags
# (or from the Actions tab → "Build apps" → Run workflow)
name: Build apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: Mixtape-Windows.exe
          - os: macos-latest          # Apple Silicon (M1 and newer)
            asset: Mixtape-Mac-AppleSilicon.zip
          - os: macos-15-intel        # older Intel Macs
            asset: Mixtape-Mac-Intel.zip
          - os: ubuntu-22.04
            asset: Mixtape-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
      - name: Make icons
        run: python assets/make_icons.py
      - name: Build
        run: pyinstaller --noconfirm mixtape.spec
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Move-Item dist/Mixtape.exe ${{ matrix.asset }}
      - name: Package (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Mixtape.app ${{ matrix.asset }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: mv dist/Mixtape ${{ matrix.asset }} && chmod +x ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
